name: release

on:
  push:
  pull_request:

jobs:
  build:
    name: build-windows
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build RoundedTB.sln -c Release
      - name: Test Avalonia views
        run: dotnet test RoundedTB.Tests/RoundedTB.Tests.csproj -c Release --no-build
      - name: Publish Windows application
        run: dotnet publish RoundedTB/RoundedTB.csproj -c Release -r win-x64 --self-contained true -o artifacts/RoundedTB
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtb-artifacts
          path: artifacts/RoundedTB/
      - name: Install Inno Setup compiler
        run: choco install innosetup --version=6.7.3 --yes --no-progress
      - name: Build installer
        shell: powershell
        run: .\scripts\build-installer.ps1
      - name: Test installer and uninstaller
        shell: powershell
        run: .\RoundedTB.Tests\PowerShell\Test-Installer.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RoundedTB-installer
          path: artifacts/installer/*.exe
