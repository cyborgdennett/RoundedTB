name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build native taskbar helper
        shell: powershell
        run: .\RoundedTB.Tests\PowerShell\Build-TaskbarPinPrototype.ps1
      - name: Build
        run: dotnet build RoundedTB.sln -c Release
      - name: Test Avalonia views
        run: dotnet test RoundedTB.Tests/RoundedTB.Tests.csproj -c Release --no-build
      - name: Publish Windows application
        run: dotnet publish RoundedTB/RoundedTB.csproj -c Release -r win-x64 --self-contained true -o artifacts/RoundedTB
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtb-artifacts
          path: artifacts/RoundedTB/
      - name: Install Inno Setup compiler
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          $signature = Get-AuthenticodeSignature $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Pyrsys*') {
            throw 'The Inno Setup compiler signature is invalid.'
          }
          $compilerDirectory = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $process = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=`"$compilerDirectory`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Compiler installation failed: $($process.ExitCode)" }
      - name: Build installer
        shell: powershell
        run: .\scripts\build-installer.ps1 -Compiler "$env:RUNNER_TEMP\InnoSetup\ISCC.exe"
      - name: Test installer and uninstaller
        shell: powershell
        run: .\RoundedTB.Tests\PowerShell\Test-Installer.ps1
      - name: Upload installer test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-test-logs
          path: artifacts/installer-test-logs/*.log
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RoundedTB-installer
          path: artifacts/installer/*.exe
